# Same run, but shards are split with a Dirichlet(0.5) draw: each node gets a skewed
# class mix — like handing every lab a different slice of the day instead of a shuffle.
run: {name: cmp-dirichlet, seed: 42}
model: {name: mnist_cnn}
data: {name: tiny, scheme: dirichlet, dirichlet_alpha: 0.5, num_shards: 4, val_fraction: 0.25}
training: {local_epochs: 2, batch_size: 32}
federation:
  token: compare-demo
  rounds: 10
  min_participants: 2
  round_deadline_s: 120
  heartbeat_s: 0.5
  liveness_timeout_s: 10
early_stopping: {metric: val_accuracy, patience: 4}
evaluation: {central_test: {mode: "off"}}
